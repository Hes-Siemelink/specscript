$id: "https://specscript.info/v1/commands/core/Conditions"
$schema: https://json-schema.org/draft/2020-12/schema

$ref: "#/definitions/Condition"

definitions:

  ConditionBase:
    type: object
    properties:
      all:
        $ref: "#/definitions/Conditions"
      any:
        $ref: "#/definitions/Conditions"
      empty: { }
      item: { }
      equals: { }
      in:
        $ref: "#/definitions/Container"
      not:
        $ref: "#/definitions/Condition"

    oneOf:
      - required:
          - all
      - required:
          - any
      - required:
          - empty
      - required:
          - equals
          - item
      - required:
          - item
          - in
      - required:
          - not

    message:
      oneOf: "A condition must be exactly one of 'item' with 'equals' or 'in', 'all', 'any', 'not', or 'empty'."

  Condition:
    $ref: "#/definitions/ConditionBase"
    unevaluatedProperties: false

  Conditions:
    type: array
    items:
      $ref: "#/definitions/Condition"

  Container:
    type:
      - string
      - array
      - object
