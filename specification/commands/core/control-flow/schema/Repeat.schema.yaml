$id: "https://specscript.info/v1/commands/core/control-flow/Repeat"
$schema: https://json-schema.org/draft/2020-12/schema

type: object
properties:
  until:
    oneOf:
      - type: string
      - type: boolean
      - type: number
      - type: array
      - $ref: "/v1/commands/core/Conditions.schema.yaml"
    message:
      oneOf: "The 'until' condition must be a condition object, or a string, boolean, number or array."
