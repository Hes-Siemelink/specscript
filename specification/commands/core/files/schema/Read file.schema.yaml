$schema: https://json-schema.org/draft/2020-12/schema

oneOf:
  - type: string

  - type: object

    properties:
      file:
        type: string
      resource:
        type: string
    additionalProperties: false
    x-default-property: file

    oneOf:
      - required:
          - file
        not:
          required:
            - resource

      - required:
          - resource
        not:
          required:
            - file
