$schema: https://json-schema.org/draft/2020-12/schema

oneOf:
  - type: string

  - type: object

    properties:
      file:
        type: string
      resource:
        type: string
    additionalProperties: false
    x-default-property: file

    oneOf:
      - required:
          - file
        not:
          required:
            - resource

      - required:
          - resource
        not:
          required:
            - file
    message:
      oneOf: "Read file requires either a 'file' or 'resource', but not both."

message:
  oneOf: "Read file requires a path string, or an object with a 'file' or 'resource'."
