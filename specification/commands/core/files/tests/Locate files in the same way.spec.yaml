Tests:

  - Test case: Read file from working directory (short way)

    Read file: content/plain.yaml

    Expected output:
      loaded: true

  - Test case: Read file from working directory (file property)

    Read file:
      file: content/plain.yaml

    Expected output:
      loaded: true

  - Test case: Read file relative to script

    Read file: ${SCRIPT_HOME}/content/plain.yaml

    Expected output:
      loaded: true

  - Test case: Read file relative to script (resource property)

    Read file:
      resource: content/plain.yaml

    Expected output:
      loaded: true

  - Test case: Run from same directory (short way)

    Run: greet.spec.yaml

    Expected output: Hello world!

  - Test case: Run from working directory (file property)

    Run:
      file: greet.spec.yaml
      input:
        name: Fay

    Expected output: Hello Fay!

  - Test case: Run relative to script

    Run:
      file: ${SCRIPT_HOME}/greet.spec.yaml
      input:
        name: Ray

    Expected output: Hello Ray!

  - Test case: Run relative to script (script property)

    Run:
      script: greet.spec.yaml
      input:
        name: Ray

    Expected output: Hello Ray!

  - Test case: Shell command in same directory as script

    Shell: sh ${SCRIPT_HOME}/hello.sh

    Expected output: Hello World

  - Test case: Shell command from current directory (short way)

    Shell: sh hello.sh

    Expected output: Hello World

  - Test case: Shell command in same directory as script (resource property)

    Shell:
      resource: sh hello.sh

    Expected output: Hello World
