Before all tests:

  Http session:
    name: test-server
    url: http://localhost:2525
    cookies:
      maria: biscuit

Tests:

  - Test case: GET with full URL

    GET: http://localhost:2525/items

    Expected output:
      - 1
      - 2
      - 3

  - Test case: GET with implicit url and explicit path parameter

    GET:
      path: /items

    Expected output:
      - 1
      - 2
      - 3

  - Test case: GET with query parameters

    GET: /echo/query?content=hello

    Expected output:
      content: hello

  - Test case: POST

    POST:
      path: /echo/body
      body:
        1: One
        2: Two
        3: Three

    Expected output:
      1: One
      2: Two
      3: Three

  - Test case: POST with list

    POST:
      path: /echo/body
      body:
        - One
        - Two
        - Three

    Expected output:
      - One
      - Two
      - Three

  - Test case: POST without path parameter

    POST:
      url: http://localhost:2525/echo/body
      body:
        1: One
        2: Two
        3: Three

    Expected output:
      1: One
      2: Two
      3: Three

  - Test case: Headers

    GET:
      path: /echo/headers
      headers:
        Test: something

    Expected output contains:
      Test: something

  - Test case: Cookies

    GET:
      path: /echo/cookies
      cookies:
        speculaas: spicy

    Expected output contains:
      maria: biscuit
      speculaas: spicy

  - Test case: Path parameters

    GET:
      path: /echo/path/custom

    Expected output:
      path: custom
