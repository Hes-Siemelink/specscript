$id: "https://specscript.info/v1/commands/core/script-info/Input_schema"
$schema: https://json-schema.org/draft/2020-12/schema

type: object
properties:
  type:
    oneOf:
      - type: string
        const: object
      - type: array
        items:
          type: string
  properties:
    type: object
    additionalProperties:
      $ref: "/v1/commands/core/ParameterData.schema.yaml"
  required:
    type: array
    items:
      type: string
  x-default-property:
    type: string
required:
  - type
  - properties
additionalProperties: false
