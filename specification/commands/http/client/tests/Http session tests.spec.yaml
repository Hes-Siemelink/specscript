Tests:

  - Test case: Session parameters are used

    Http session:
      name: base
      url: http://localhost:2525

    GET:
      path: /items

    Expected output:
      - 1
      - 2
      - 3

    Http close session: base


  - Test case: Request parameters override session parameters

    Http session:
      name: items
      url: http://localhost:2525
      path: /items

    GET:
      path: /hello

    Expected output: Hello from SpecScript!

    Http close session: items


  - Test case: Session headers merge with request headers

    Http session:
      name: with-headers
      url: http://localhost:2525
      headers:
        Session-Header: from-session

    GET:
      path: /echo/headers
      headers:
        Request-Header: from-request

    Expected output contains:
      Session-Header: from-session
      Request-Header: from-request

    Http close session: with-headers


  - Test case: Session cookies merge with request cookies

    Http session:
      name: with-cookies
      url: http://localhost:2525
      cookies:
        maria: biscuit

    GET:
      path: /echo/cookies
      cookies:
        speculaas: spicy

    Expected output:
      maria: biscuit
      speculaas: spicy

    Http close session: with-cookies


  - Test case: The most recently opened session is the current one

    Http session:
      - name: items
        url: http://localhost:2525
        path: /items
      - name: hello
        url: http://localhost:2525
        path: /hello

    GET: { }

    Expected output: Hello from SpecScript!

    Http close session:
      - hello
      - items


  - Test case: Closing the current session makes the previous one current

    Http session:
      - name: items
        url: http://localhost:2525
        path: /items
      - name: hello
        url: http://localhost:2525
        path: /hello

    Http close session: hello

    Do:
      GET: { }

      Expected output:
        - 1
        - 2
        - 3

      Http close session: items


  - Test case: Target a session by name

    Http session:
      - name: items
        url: http://localhost:2525
        path: /items
      - name: hello
        url: http://localhost:2525
        path: /hello

    GET:
      session: items

    Expected output:
      - 1
      - 2
      - 3

    Http close session:
      - hello
      - items


  - Test case: Close a session with the session object

    Http session:
      url: http://localhost:2525
    As: ${session}

    Http close session: ${session}


  - Test case: Generated session names contain the session parameters

    Http session:
      url: http://localhost:2525
      path: /items
    As: ${session}

    Assert that:
      item:
        url: http://localhost:2525
        path: /items
      in: ${session}

    Http close session: ${session}


  - Test case: Opening a session with the name of an open session replaces it

    Http session:
      - name: twice
        url: http://localhost:2525
        path: /items
      - name: twice
        url: http://localhost:2525
        path: /hello

    GET: { }

    Expected output: Hello from SpecScript!

    Http close session: twice

