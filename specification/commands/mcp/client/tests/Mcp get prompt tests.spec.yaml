Before all tests:

  Mcp server:
    name: mcp-prompt-test-server
    port: 8101
    prompts:
      summarize:
        description: Summarize text
        script:
          Output: Please summarize the following text.
      review:
        description: Review code
        arguments:
          - name: code
            description: The code to review
            required: true
          - name: language
            description: Programming language
            required: false
        script:
          Output: Please review this ${input.language} code - ${input.code}
      review-from-file:
        description: Review from external file
        script: review-prompt.spec.yaml


After all tests:

  Stop mcp server: mcp-prompt-test-server


Tests:

  - Test case: Get prompt with no input

    Mcp get prompt:
      name: summarize
      server:
        url: http://localhost:8101/mcp

    Expected output: Please summarize the following text.


  - Test case: Get prompt with input arguments

    Mcp get prompt:
      name: review
      arguments:
        code: "def foo(): pass"
        language: Python
      server:
        url: http://localhost:8101/mcp

    Expected output: "Please review this Python code - def foo(): pass"


  - Test case: Get prompt with variable resolution in input

    ${lang}: Kotlin

    Mcp get prompt:
      name: review
      arguments:
        code: "fun bar() {}"
        language: ${lang}
      server:
        url: http://localhost:8101/mcp

    Expected output: "Please review this Kotlin code - fun bar() {}"


  - Test case: Get prompt backed by external script file

    Mcp get prompt:
      name: review-from-file
      server:
        url: http://localhost:8101/mcp

    Expected output: Please review the following code and suggest improvements.


  - Test case: Get prompt in the current session

    Mcp session:
      name: prompt-session
      url: "http://localhost:8101/mcp"

    Mcp get prompt:
      name: summarize

    Expected output: Please summarize the following text.

    Mcp close session: prompt-session


  - Test case: Get prompt targeting a specific session

    Mcp session:
      name: prompt-session
      url: "http://localhost:8101/mcp"

    Mcp get prompt:
      session: prompt-session
      name: review
      arguments:
        code: "def foo(): pass"
        language: Python

    Expected output: "Please review this Python code - def foo(): pass"

    Mcp close session: prompt-session
