Tests:

  - Test case: Bracket notation with nested property

    ${config}:
      server.host:
        name: localhost
        port: 8080

    Assert equals:
      - actual: ${config["server.host"].name}
        expected: localhost
      - actual: ${config["server.host"].port}
        expected: 8080

  - Test case: Bracket notation with multiple dots in key

    ${api}:
      com.example.service:
        status: ok

    Assert equals:
      actual: ${api["com.example.service"].status}
      expected: ok

  - Test case: Bracket notation for key with spaces

    ${data}:
      first name: Alice

    Assert equals:
      actual: ${data["first name"]}
      expected: Alice

  - Test case: Bracket notation mixed with array index

    ${data}:
      items:
        - name.first: Alice
        - name.first: Bob

    Assert equals:
      - actual: ${data.items[0]["name.first"]}
        expected: Alice
      - actual: ${data.items[1]["name.first"]}
        expected: Bob


  - Test case: SCRIPT_HOME is available

    Assert that:
      not:
        empty: ${SCRIPT_HOME}

  - Test case: PWD is available

    Assert that:
      not:
        empty: ${PWD}



  - Test case: Unset environment variable is empty

    Assert that:
      empty: ${env.THIS_VAR_CERTAINLY_DOES_NOT_EXIST_12345}
